<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwinDiff</title>
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #e5e7eb;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 160px; height: 160px; }
  h1 { font-size: clamp(40px, 8vw, 64px); margin: 16px 0 8px; letter-spacing: -0.02em; }
  p { max-width: 640px; margin: 0 auto 12px; font-size: 18px; line-height: 1.5; color: #c7cbd1; }
  .tag { display: inline-block; margin-top: 12px; padding: 6px 14px; border: 1px solid #374151; border-radius: 999px; font-size: 14px; color: #9ca3af; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="TwinDiff logo">
  <h1>TwinDiff</h1>
  <p>TwinDiff, gömülü sistem geliştiricileri için kendi C derleyicisiyle (k8cc) firmware'i GCC'ye karşı çapraz doğrulayan ve kartlara güvenli, kanıtlanabilir şekilde yazılım yükleyen bir masaüstü aracıdır.</p>
  <span class="tag">Geliştirme aşamasında</span>
</main>
</body>
</html>
